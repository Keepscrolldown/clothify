<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Clothify</title>
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1 class="login-logo">CLOTHIFY</h1>
                <p class="login-subtitle">Admin Portal</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Enter username" 
                        required
                        data-testid="admin-login-username"
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Enter password" 
                        required
                        data-testid="admin-login-password"
                    >
                </div>

                <button type="submit" class="login-button" data-testid="admin-login-submit">
                    <span id="button-text">Login</span>
                </button>

                <div id="error-message" class="error-message" style="display: none;"></div>
            </form>

            <div class="back-link">
                <a href="index.html">← Back to Store</a>
            </div>

            <div class="default-credentials">
                <p>Default credentials:</p>
                <p>Username: <span class="credential">admin</span></p>
                <p>Password: <span class="credential">admin123</span></p>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="admin-login.js"></script>
</body>
</html>
